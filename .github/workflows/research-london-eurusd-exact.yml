name: Research EURUSD London exact

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_london_eurusd_dukascopy.py"
      - ".github/workflows/research-london-eurusd-exact.yml"

permissions:
  contents: read

jobs:
  eurusd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "dukascopy-python>=4.0" "tzdata>=2025.2"
      - name: Run exact EURUSD London breakout
        run: python research/backtest_london_eurusd_dukascopy.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-london-exact
          path: research/results/
          retention-days: 14
