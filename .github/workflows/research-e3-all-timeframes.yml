name: Research E3 all timeframes

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_e3_all_timeframes.py"
      - ".github/workflows/research-e3-all-timeframes.yml"

permissions:
  contents: read

jobs:
  e3all:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run E3 all timeframes
        run: python research/backtest_e3_all_timeframes.py --symbol "${{ matrix.symbol }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-all-${{ matrix.symbol }}
          path: research/results/
          retention-days: 14
