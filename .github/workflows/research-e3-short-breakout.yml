name: Research E3 short breakout

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_e3_short_breakout.py"
      - ".github/workflows/research-e3-short-breakout.yml"

permissions:
  contents: read

jobs:
  e3:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run E3
        run: python research/backtest_e3_short_breakout.py --symbol "${{ matrix.symbol }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-short-breakout-${{ matrix.symbol }}
          path: research/results/
          retention-days: 14
