name: Gold shallow sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_gold_shallow_sensitivity.py"
      - ".github/workflows/gold-shallow-sensitivity.yml"

permissions:
  contents: read

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run Gold shallow sensitivity
        run: |
          python research/backtest_gold_shallow_sensitivity.py --symbol XAUUSD
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-shallow-sensitivity
          path: research/results/
          if-no-files-found: warn
          retention-days: 14
