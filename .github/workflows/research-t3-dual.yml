name: Research T3 MACD RSI dual

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_t3_dual_filter.py"
      - ".github/workflows/research-t3-dual.yml"

permissions:
  contents: read

jobs:
  dual:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run dual filter comparison
        run: python research/backtest_t3_dual_filter.py --symbol "${{ matrix.symbol }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-dual-${{ matrix.symbol }}
          path: research/results/
          retention-days: 14
