name: Research RSI trend modes

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_rsi_trend_modes.py"
      - ".github/workflows/research-rsi-trend-modes.yml"

permissions:
  contents: read

jobs:
  rsi_trend:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run RSI trend-mode test
        run: python research/backtest_rsi_trend_modes.py --symbol "${{ matrix.symbol }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-trend-modes-${{ matrix.symbol }}
          path: research/results/
          retention-days: 14
