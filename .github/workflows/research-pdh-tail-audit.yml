name: Research PDH breakout tail audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_pdh_breakout_tail_audit.py"
      - ".github/workflows/research-pdh-tail-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run tail audit
        run: python research/backtest_pdh_breakout_tail_audit.py --symbol "${{ matrix.symbol }}"
