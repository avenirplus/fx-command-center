name: Research GO_SCAL components

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_goscal_components.py"
      - ".github/workflows/research-goscal-components.yml"

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run component screen
        run: python research/backtest_goscal_components.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goscal-components
          path: research/results/
          retention-days: 14
