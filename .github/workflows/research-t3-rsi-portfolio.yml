name: Research T3 RSI portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_portfolio_rsi.py"
      - ".github/workflows/research-t3-rsi-portfolio.yml"

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run T3 RSI portfolio
        run: python research/backtest_portfolio_rsi.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-rsi-portfolio
          path: research/results/
          retention-days: 14
