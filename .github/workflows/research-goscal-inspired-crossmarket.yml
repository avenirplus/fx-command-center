name: Research GO_SCAL inspired crossmarket

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_goscal_inspired_v01_crossmarket.py"
      - ".github/workflows/research-goscal-inspired-crossmarket.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run USDJPY external-market screen
        run: python research/backtest_goscal_inspired_v01_crossmarket.py --symbol USDJPY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goscal-inspired-v01-usdjpy
          path: research/results/
          retention-days: 14
