name: Research T1 RSI exit robustness

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_t1_rsi_exit_robustness.py"
      - ".github/workflows/research-t1-rsi-exit.yml"

permissions:
  contents: read

jobs:
  exit_test:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run exit robustness
        run: python research/backtest_t1_rsi_exit_robustness.py --symbol "${{ matrix.symbol }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-rsi-exit-${{ matrix.symbol }}
          path: research/results/
          retention-days: 14
