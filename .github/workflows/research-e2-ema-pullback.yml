name: Research E2 EMA pullback

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_e2_ema_pullback.py"
      - ".github/workflows/research-e2-ema-pullback.yml"

permissions:
  contents: read

jobs:
  e2:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run E2
        run: python research/backtest_e2_ema_pullback.py --symbol "${{ matrix.symbol }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-ema-pullback-${{ matrix.symbol }}
          path: research/results/
          retention-days: 14
