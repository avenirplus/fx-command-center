name: Research hidden-divergence backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_hidden_divergence.py"
      - "research/backtest_trend_modes.py"
      - "research/backtest_fib_bands.py"
      - "research/backtest_sensitivity.py"
      - "research/backtest_gold_shallow_sensitivity.py"
      - ".github/workflows/research-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [USDJPY, XAUUSD]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"

      - name: Run reconstructed cross-market backtest
        run: |
          python research/backtest_hidden_divergence.py --symbol "${{ matrix.symbol }}"

      - name: Run pre-registered F1 trend-mode comparison
        run: |
          python research/backtest_trend_modes.py --symbol "${{ matrix.symbol }}"

      - name: Run T2 MACD sensitivity robustness test
        run: |
          python research/backtest_sensitivity.py --symbol "${{ matrix.symbol }}"

      - name: Run formal F1 Fibonacci-band robustness
        run: |
          python research/backtest_fib_bands.py --symbol "${{ matrix.symbol }}"

      - name: Run Gold shallow-pullback sensitivity
        if: matrix.symbol == 'XAUUSD'
        run: |
          python research/backtest_gold_shallow_sensitivity.py --symbol XAUUSD

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-divergence-${{ matrix.symbol }}
          path: research/results/
          if-no-files-found: warn
          retention-days: 14
