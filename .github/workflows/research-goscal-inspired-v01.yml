name: Research GO_SCAL inspired v0.1

on:
  workflow_dispatch:
  push:
    paths:
      - "research/GOSCAL_INSPIRED_V01_PREREGISTERED_SPEC.md"
      - "research/backtest_goscal_inspired_v01.py"
      - ".github/workflows/research-goscal-inspired-v01.yml"

permissions:
  contents: read

jobs:
  inspired:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=2,<3" "gdown>=5,<6"
      - name: Run inspired screen
        run: python research/backtest_goscal_inspired_v01.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goscal-inspired-v01
          path: research/results/
          retention-days: 14
